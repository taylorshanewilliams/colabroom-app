<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bring a song, a part, or an idea. Make it together in CoLabRoom.">
  <link rel="canonical" href="https://app.colabroom.com/">

  <!-- One public card for the app. Private songs and invitation details stay
       behind sign-in; preview clients do not run Flutter to read these tags.
       No og:url: this page is also 404.html and answers /?invite=CODE, and an
       og:url naming the root would declare every pasted link to be the root.
       rel=canonical still names the root, and some crawlers infer og:url from
       it; the paste test at the web republish settles which clients keep the
       invitation's code. -->
  <meta property="og:title" content="Come make music">
  <meta property="og:description" content="Bring a song, a part, or an idea. Make it together in CoLabRoom.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CoLabRoom">
  <meta property="og:image" content="https://colabroom.com/share.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="CoLabRoom. Songwriting for musicians who aren't in the same room. Record a riff. Somebody else sings over it from anywhere.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Come make music">
  <meta name="twitter:description" content="Bring a song, a part, or an idea. Make it together in CoLabRoom.">
  <meta name="twitter:image" content="https://colabroom.com/share.png">
  <meta name="twitter:image:alt" content="CoLabRoom. Songwriting for musicians who aren't in the same room. Record a riff. Somebody else sings over it from anywhere.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CoLabRoom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Come make music — CoLabRoom</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
